
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FitGear | Administración</title>

  <link rel="stylesheet" href="../css/admin.css?v=1">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="cabecera">
    <div>
      <strong>FitGear</strong>
      <span>Panel de administración</span>
    </div>
    <button id="cerrar-sesion" hidden>
      Cerrar sesión
    </button>
  </header>

  <main>
    <section id="login" class="panel login">
      <h1>Acceso ADMIN</h1>
      <p>Solo para personal autorizado de FitGear.</p>

      <form id="form-login">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email"
               autocomplete="username" required>

        <label for="password">Contraseña</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button type="submit">Iniciar sesión</button>
      </form>
    </section>

    <section id="administracion" hidden>
      <div class="encabezado-panel">
        <div>
          <h1>Inventario de máquinas</h1>
          <p>Gestiona los productos de tu catálogo.</p>
        </div>
        <button id="nuevo-producto">
          + Nueva máquina
        </button>
      </div>

      <div class="panel">
        <h2 id="titulo-formulario">Registrar máquina</h2>

        <form id="form-producto">
          <input type="hidden" name="id">

          <div class="campos">
            <label>
              Nombre de máquina *
              <input name="nombre" required>
            </label>

            <label>
              Marca *
              <select name="marca" required>
                <option value="">Seleccionar</option>
                <option>Hammer Strength</option>
                <option>Life Fitness</option>
                <option>Cybex</option>
                <option>Nautilus</option>
                <option>Matrix</option>
                <option>Otra</option>
              </select>
            </label>

            <label>
              Modelo
              <input name="modelo">
            </label>

            <label>
              Código interno
              <input name="codigo_interno">
            </label>

            <label>
              Área *
              <select name="area" required>
                <option value="">Seleccionar</option>
                <option>Selector izado</option>
                <option>Cardio</option>
                <option>Peso Libre</option>
                <option>Palanca / Carga de Discos</option>
                <option>Funcional / Cross Training / HIIT</option>
              </select>
            </label>

            <label>
              Categoría *
              <input name="categoria"
                     placeholder="Ej. Hombros, Piernas"
                     required>
            </label>

            <label>
              Precio (GTQ)
              <input name="precio" type="number"
                     min="0" step="0.01">
            </label>

            <label>
              Precio especial (GTQ)
              <input name="precio_especial" type="number"
                     min="0" step="0.01">
            </label>

            <label>
              Existencias *
              <input name="existencias" type="number"
                     min="0" step="1" value="0" required>
            </label>

            <label>
              Estado
              <select name="estado">
                <option value="disponible">Disponible</option>
                <option value="consultar">Consultar</option>
                <option value="preventa">Preventa</option>
                <option value="agotado">Agotado</option>
              </select>
            </label>

            <label>
              Color
              <input name="color">
            </label>

            <label>
              Peso (kg)
              <input name="peso_kg" type="number"
                     min="0" step="0.01">
            </label>

            <label>
              Dimensiones
              <input name="dimensiones"
                     placeholder="Largo x ancho x alto">
            </label>

            <label>
              Músculos trabajados
              <input name="musculos">
            </label>

            <label class="ancho-completo">
              URL de imagen principal
              <input name="imagen_url" type="url"
                     placeholder="https://...">
            </label>

            <label class="ancho-completo">
              Descripción
              <textarea name="descripcion"
                        rows="4"></textarea>
            </label>
          </div>

          <div class="opciones">
            <label>
              <input type="checkbox" name="preventa">
              Es preventa
            </label>

            <label>
              <input type="checkbox" name="publicado">
              Publicar en catálogo
            </label>
          </div>

          <div class="acciones">
            <button type="submit" id="guardar-producto">
              Guardar máquina
            </button>
            <button type="button" id="cancelar-edicion"
                    class="secundario">
              Limpiar formulario
            </button>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2>Máquinas registradas</h2>
        <div id="lista-admin"></div>
      </div>
    </section>

    <p id="mensaje" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
