
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitGear | Venta y Renta</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101719;
      color: white;
    }

    header {
      padding: 24px 8%;
      background: #172427;
      border-bottom: 3px solid #18a99e;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #22b9ad;
    }

    .hero {
      text-align: center;
      padding: 90px 20px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 58px);
    }

    p { color: #b6c5c7; }

    .btn {
      display: inline-block;
      padding: 15px 26px;
      margin-top: 20px;
      border-radius: 8px;
      background: #18a99e;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    #catalogo {
      padding: 50px 8%;
      background: #172427;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">FITGEAR</div>
    <small>VENTA Y RENTA</small>
  </header>

  <main>
    <section class="hero">
      <h1>Equipa tu gimnasio con lo mejor</h1>
      <p>
        Equipos comerciales de las mejores marcas.
        Venta, renta y preventa.
      </p>
      <a href="#catalogo" class="btn">Explorar catálogo</a>
    </section>

    <section id="catalogo">
      <h2>Nuestras máquinas</h2>
      <p>Próximamente: nuestro catálogo de equipos.</p>
    </section>
  </main>
</body>
</html>
